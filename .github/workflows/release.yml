name: Build Windows Portable Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Install build & test dependencies
        run: pip install -e .

      - name: Run full test suite
        run: python -m unittest discover -s tests -v

      - name: Setup MSVC and compile piaosu.exe launcher
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile piaosu.exe with VERSIONINFO and manifest
        shell: cmd
        run: |
          mkdir prebuilt_windows
          cd windows
          rc /nologo /fo piaosu.res piaosu.rc
          cl /nologo /O2 /MT /utf-8 /W3 launcher.c piaosu.res /Fe:"..\prebuilt_windows\piaosu.exe" /link /SUBSYSTEM:WINDOWS /MANIFEST:NO user32.lib kernel32.lib

      - name: Stage official Python 3.12.7 embedded runtime and Tcl/Tk
        shell: pwsh
        run: |
          $rt = "build\runtime"
          New-Item -ItemType Directory -Force $rt | Out-Null
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/3.12.7/python-3.12.7-embed-amd64.zip" -OutFile "build\embed.zip"
          Expand-Archive "build\embed.zip" -DestinationPath $rt -Force

          # Copy Tcl/Tk from hosted Python 3.12.7 so tkinter GUI works out of the box
          $pyBase = Split-Path -Parent (Get-Command python).Source
          foreach ($dll in @("_tkinter.pyd", "tcl86t.dll", "tk86t.dll", "zlib1.dll", "libffi-8.dll")) {
            $src = Join-Path $pyBase "DLLs\$dll"
            if (Test-Path $src) {
              Copy-Item $src $rt -Force
            }
          }
          Copy-Item "$pyBase\tcl" "$rt\tcl" -Recurse -Force
          Copy-Item "$pyBase\Lib\tkinter" "$rt\Lib\tkinter" -Recurse -Force

          # Install runtime site-packages inside portable runtime
          $sitePkg = "$rt\Lib\site-packages"
          New-Item -ItemType Directory -Force $sitePkg | Out-Null
          python -m pip install --no-warn-script-location --target $sitePkg openpyxl pymupdf pypdf

      - name: Assemble portable Windows zip and SHA256.txt
        run: python -m tools.build_windows_release --runtime-dir build/runtime

      - name: Smoke-test assembled portable zip
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist -Filter "piaosu-*.zip" | Select-Object -First 1
          $verify = "build\verify_portable"
          if (Test-Path $verify) { Remove-Item -Recurse -Force $verify }
          Expand-Archive $zip.FullName -DestinationPath $verify -Force
          $pkg = Get-ChildItem $verify -Directory | Select-Object -First 1
          & "$($pkg.FullName)\runtime\python.exe" -m piaosu doctor
          if ($LASTEXITCODE -ne 0) { throw "Portable doctor failed" }
          & "$($pkg.FullName)\runtime\python.exe" -c "import tkinter, openpyxl, pymupdf, pypdf, piaosu; print('PORTABLE OK', piaosu.__version__)"
          if ($LASTEXITCODE -ne 0) { throw "Portable import check failed" }

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: piaosu-windows-portable
          path: |
            dist/*.zip
            dist/SHA256.txt

      - name: Publish GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256.txt
